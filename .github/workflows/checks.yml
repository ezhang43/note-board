# Runs every check (typecheck, unit tests, Firestore rules tests, browser tests) on each pull request
# into build/v1 and on build/v1 itself. A pull request shows pass / fail on GitHub, and one with
# auto-merge turned on merges by itself once this passes (build rule 9). On a push to build/v1 that
# passes, the Publish job puts it live when every unpublished change is a low-risk pull request (owner
# chose this on 2026-10-05).
name: Checks

on:
  pull_request:
    branches: [build/v1]
  push:
    branches: [build/v1]

permissions:
  contents: read

jobs:
  # Typecheck and unit tests, in parallel with the browser shards below.
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer push cancels the tests of an older one (only the tests: a publish under way finishes).
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The browser tests, split into 4 parallel shards (Playwright's --shard; fullyParallel spreads them).
  browser:
    name: Browser tests ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # let every shard finish, so one run lists all the failures
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: checks-${{ github.ref }}-browser-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Browser downloads sometimes hang for the whole 30 minutes, so: keep the browsers between runs
      # (key = the installed @playwright/test version; bump it by upgrading the package), and give the
      # install 6 minutes per try with one retry. On a cache hit the install only adds the OS packages.
      - id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        timeout-minutes: 14
        run: timeout 6m npx playwright install --with-deps chromium webkit || timeout 6m npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      # A failed browser test keeps its trace, screenshot and video; download them from the run's page.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The Firestore rules tests (rules/), on the local Firestore emulator, which needs Java. A demo-
  # project id: nothing here reaches the real Firebase project, and no secrets are used.
  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: checks-${{ github.ref }}-rules
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # The emulator (about 60 MB) is downloaded on first use; keep it between runs. The key is the
      # firebase-tools version in package.json's test:rules script: change both together.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.32.1
      - run: npm run test:rules

  # The one check the branch protection and Publish wait for: passes only when typecheck, unit tests,
  # the rules tests and all 4 browser shards passed. Keep the name "All tests" exactly.
  all-tests:
    name: All tests
    needs: [checks, browser, rules]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.checks.result }}" = success -a "${{ needs.browser.result }}" = success -a "${{ needs.rules.result }}" = success

  # Auto-publish (build rule 9): after All tests passes on a push to build/v1, fast-forward main to
  # that commit and start the Pages deploy, but only when every change main lacks is a merged pull
  # request that isn't labelled high-risk and touches no saving / sync / undo / deleting file
  # (scripts/publish-rules.mjs). Anything else waits for the owner's "publish".
  publish:
    name: Publish
    needs: all-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/v1'
    runs-on: ubuntu-latest
    permissions:
      contents: write # move main
      actions: write # start the deploy
      pull-requests: read
    concurrency:
      group: auto-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: decide
        run: node scripts/auto-publish.mjs "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
      # A push made with the job's own token doesn't start deploy.yml by itself, so start it by hand.
      - if: steps.decide.outputs.publish == 'true'
        run: |
          git push origin "${{ github.sha }}:refs/heads/main"
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
