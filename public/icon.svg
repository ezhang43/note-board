    <circle cx="136" cy="270" r="11" fill="#F28B82" opacity=".75"/>
    <circle cx="226" cy="266" r="11" fill="#F28B82" opacity=".75"/>
    <path d="M162 276 Q182 294 204 274" fill="none" stroke="#FFFFFF" stroke-width="7"/>
